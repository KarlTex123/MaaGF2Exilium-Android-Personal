name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      assemble:
        description: "APK build type (release requires signing secrets; artifacts only)"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    uses: ./.github/workflows/android-build.yml
    with:
      assemble: ${{ inputs.assemble }}
    secrets: inherit
